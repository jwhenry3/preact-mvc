<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>preact-mvc — page not found</title>
    <style>
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center;
        background: #0d1017; color: #e8eaf6;
        font-family: 'Segoe UI', system-ui, sans-serif;
      }
      main { text-align: center; max-width: 480px; padding: 24px; }
      h1 { font-size: 2rem; margin-bottom: 8px; }
      p { color: #8a90b8; line-height: 1.6; }
      a { color: #8b9cf9; }
      code { background: #171c28; border: 1px solid #2a3350; border-radius: 4px; padding: 1px 6px; font-size: .9em; }
    </style>
    <script>
      // The docs site lives at <root>/docs/<route>/. A miss one level under
      // the docs root is probably a stale deep link — offer the docs home.
      var p = location.pathname;
      var docsIdx = p.indexOf('/docs/');
      var docsHome = docsIdx >= 0 ? p.slice(0, docsIdx + 6) : './docs/';
      var home = docsIdx >= 0 ? p.slice(0, docsIdx + 1) : './';
      document.addEventListener('DOMContentLoaded', function () {
        document.getElementById('docs-home').href = docsHome;
        document.getElementById('site-home').href = home;
        document.getElementById('path').textContent = p;
      });
    </script>
  </head>
  <body>
    <main>
      <h1>Page not found</h1>
      <p><code id="path"></code> doesn't exist in this site.</p>
      <p>
        <a id="docs-home" href="./docs/">Browse the documentation</a> ·{' '}
        <a id="site-home" href="./">Back to the homepage</a>
      </p>
    </main>
  </body>
</html>
