# Publish — creating a GitHub Release STAGES every package at the release
# tag's version (lockstep; repo files keep version "0.0.0" — the release
# artifact carries the stamped version). Staged packages are not
# installable until a maintainer approves them — `npm stage list/view/
# approve`, or the Staged Packages tab on npmjs.com (approval needs 2FA).
#
# Auth: npm trusted publishing (OIDC) — `id-token: write` lets the npm CLI
# exchange the job's OIDC token for a short-lived credential; no stored
# secret. Requires a trust relationship per package:
#   npm trust github <pkg> --repo <owner>/preact-mvc --file publish.yml --allow-stage-publish -y
# Use --allow-stage-publish WITHOUT --allow-publish so this workflow is
# stage-only — direct `npm publish` is rejected outright. Until a package
# has a trust relationship, NODE_AUTH_TOKEN (granular NPM_TOKEN secret)
# covers it — remove that env var once all packages are configured.
#
# First release only: `npm stage publish` cannot CREATE packages — each
# must exist on npm first. Bootstrap once, locally:
#   node scripts/publish.mjs <version> --direct
name: Publish

on:
  release:
    types: [published]

jobs:
  # Don't publish a red tree: the same suites as ci.yml.
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            docs-consumer/package-lock.json
            examples/enterprise/package-lock.json

      - name: Install dependencies
        run: node scripts/ci-install.mjs

      - name: Typecheck — root
        run: npx tsc --noEmit

      - name: Test — vitest
        run: npm test

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance + OIDC trusted publishing
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: |
            package-lock.json
            docs-consumer/package-lock.json
            examples/enterprise/package-lock.json

      - name: Upgrade npm (stage requires CLI >= 11.15.0)
        run: npm install -g "npm@^11"

      - name: Install dependencies
        run: node scripts/ci-install.mjs

      - name: Stamp versions + stage all packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }} # fallback until all packages have OIDC trust
        run: node scripts/publish.mjs "${{ github.event.release.tag_name }}"
